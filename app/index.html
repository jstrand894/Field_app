<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grids">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Grid Data</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1d2a1f;--mute:#6b7a6e;--line:#d9ded8;--accent:#2f6b3a;--done:#bfe3c4;--part:#f6e3a1;--note:#2f6b3a}
@media(prefers-color-scheme:dark){:root{--bg:#121613;--card:#1c231e;--ink:#e8efe9;--mute:#93a496;--line:#2f3a32;--accent:#6fbf7d;--done:#2f5a38;--part:#6b5a1d;--note:#6fbf7d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{max-width:900px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:grid;grid-template-columns:2fr 1.4fr 1.4fr;gap:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
input,textarea,select{font:inherit;font-size:18px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .sp{flex:1}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 16px;cursor:pointer}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button:active{transform:scale(.97)}
#prog{font-size:14px;color:var(--mute)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(14px,2.6vw,22px);position:relative;line-height:1.1}
.cell small{font-size:clamp(9px,1.6vw,13px);font-weight:500;color:var(--mute)}
.cell.done{background:var(--done);border-color:transparent}
.cell.part{background:var(--part);border-color:transparent}
.cell.has::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--note)}
.cell.cur{outline:3px solid var(--accent)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:700px;border-radius:20px 20px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:94vh;overflow:auto}
.ph{display:flex;align-items:center;justify-content:space-between}
.ph h2{margin:0;font-size:24px}
.ctr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ctl .t{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.ctl .row{display:flex;align-items:center;gap:10px;width:100%}
.ctl .row button{width:64px;height:64px;font-size:34px;padding:0;border-radius:16px}
.ctl .row input{flex:1;min-width:0;width:100%;text-align:center;font-size:40px;font-weight:700;padding:6px}
.ctl .quick{display:flex;gap:6px}
.ctl .quick button{padding:8px 12px;font-size:14px}
textarea{width:100%;min-height:90px;resize:vertical}
.nav{display:flex;gap:8px}
.nav button{flex:1}
.list{display:flex;flex-direction:column;gap:6px}
.list button{text-align:left;font-weight:500}
.hint{font-size:13px;color:var(--mute)}
@media(max-width:600px){header{grid-template-columns:1fr 1fr}header label:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<div id="app">
  <header>
    <label>Site<input id="site" autocomplete="off"></label>
    <label>Date<input id="date" type="date"></label>
    <label>Obs<input id="obs" autocomplete="off"></label>
  </header>
  <div class="bar">
    <span id="prog"></span><span class="sp"></span>
    <button id="btnSessions">Sessions</button>
    <button id="btnExport" class="pri">Export CSV</button>
  </div>
  <div id="grid"></div>
  <div class="hint">Green = done, yellow = started, dot = has notes. Tap a cell to enter data.</div>
</div>

<div id="sheet"><div class="panel" id="panel"></div></div>

<script>
const N=100, KEY='grids.v1';
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.sessions)db={cur:null,sessions:{}};
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save! Storage may be full or blocked. Export CSV now.')}};
function newSession(){
  const id='s'+Date.now();
  const prev=db.sessions[db.cur];
  db.sessions[id]={id,site:prev?prev.site:'',date:today(),obs:prev?prev.obs:'',cells:{}};
  db.cur=id;save();return db.sessions[id];
}
const S=()=>db.sessions[db.cur]||newSession();
const cell=n=>S().cells[n]||(S().cells[n]={s:null,g:null,n:'',done:false});
const state=n=>{const c=S().cells[n];if(!c)return '';if(c.done)return 'done';if(c.s!==null||c.g!==null||c.n)return 'part';return ''};

function renderGrid(){
  const g=$('#grid');g.innerHTML='';
  let done=0;
  for(let i=1;i<=N;i++){
    const c=S().cells[i],st=state(i);if(st==='done')done++;
    const b=document.createElement('button');
    b.className='cell '+st+(c&&c.n?' has':'')+(cur===i?' cur':'');
    b.innerHTML=`${i}`+(c&&(c.s!==null||c.g!==null)?`<small>${c.s??0}/${c.g??0}</small>`:'');
    b.onclick=()=>openCell(i);
    g.appendChild(b);
  }
  $('#prog').textContent=`${done} / ${N} cells done`;
}
function renderHeader(){const s=S();$('#site').value=s.site;$('#date').value=s.date;$('#obs').value=s.obs}
['site','date','obs'].forEach(k=>$('#'+k).addEventListener('input',e=>{S()[k]=e.target.value;save()}));

let cur=null;
function openCell(n){
  cur=n;const c=cell(n);
  const ctl=(key,label)=>`<div class="ctl"><div class="t">${label}</div>
    <div class="row"><button data-k="${key}" data-d="-1">−</button>
    <input data-in="${key}" inputmode="numeric" pattern="[0-9]*" placeholder="–" value="${c[key]??''}">
    <button data-k="${key}" data-d="1">+</button></div>
    <div class="quick"><button data-k="${key}" data-d="5">+5</button><button data-k="${key}" data-d="10">+10</button><button data-k="${key}" data-z="1">0</button></div></div>`;
  $('#panel').innerHTML=`<div class="ph"><h2>Cell ${n}</h2><button id="x">Close</button></div>
    <div class="ctr">${ctl('s','Stems')}${ctl('g','Galls')}</div>
    <textarea id="notes" placeholder="Notes (Pencil or dictation)">${c.n.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</textarea>
    <div class="nav"><button id="prev">← Prev</button><button id="clr">Clear</button><button id="done" class="pri">Done → Next</button></div>`;
  $('#sheet').classList.add('open');renderGrid();
}
function closeSheet(){$('#sheet').classList.remove('open');cur=null;renderGrid()}
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const c=cell(cur);
  if(b.dataset.k){
    const k=b.dataset.k;
    if(b.dataset.z)c[k]=0;
    else c[k]=Math.max(0,(c[k]??0)+Number(b.dataset.d));
    c.done=false;
    b.closest('.ctl').querySelector('input').value=c[k];save();renderGrid();
  }else if(b.id==='x')closeSheet();
  else if(b.id==='prev'&&cur>1)openCell(cur-1);
  else if(b.id==='clr'){if(confirm('Clear cell '+cur+'?')){delete S().cells[cur];save();openCell(cur)}}
  else if(b.id==='done'){
    if(c.s===null)c.s=0;if(c.g===null)c.g=0;c.done=true;save();
    if(cur<N)openCell(cur+1);else closeSheet();
  }
});
$('#panel').addEventListener('input',e=>{
  const c=cell(cur);
  if(e.target.dataset.in){
    const k=e.target.dataset.in,v=e.target.value.replace(/\D/g,'');
    e.target.value=v;c[k]=v===''?null:parseInt(v,10);c.done=false;
  }else if(e.target.id==='notes'){c.n=e.target.value}
  save();renderGrid();
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

$('#btnSessions').onclick=()=>{
  cur=null;
  const list=Object.values(db.sessions).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
  $('#panel').innerHTML=`<div class="ph"><h2>Sessions</h2><button id="x">Close</button></div>
    <button class="pri" id="new">+ New session (copies site &amp; observer)</button>
    <div class="list">${list.map(s=>{const d=Object.values(s.cells).filter(c=>c.done).length;
      return `<button data-sid="${s.id}">${s.id===db.cur?'● ':''}${s.site||'(no site)'} — ${s.date} — ${s.obs||'?'} <span class="hint">(${d}/100)</span></button>`}).join('')}</div>
    <button id="del">Delete current session</button>`;
  $('#sheet').classList.add('open');
};
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='new'){newSession();renderHeader();closeSheet()}
  else if(b.dataset.sid){db.cur=b.dataset.sid;save();renderHeader();closeSheet()}
  else if(b.id==='del'&&confirm('Delete this session and its data? Export first if unsure.')){
    delete db.sessions[db.cur];db.cur=Object.keys(db.sessions)[0]||null;save();renderHeader();closeSheet()}
});

const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
function csv(s){
  const rows=[['site','date','obs','cell','row','col','stems','galls','notes']];
  for(let i=1;i<=N;i++){
    const c=s.cells[i];if(!c||(!c.done&&c.s===null&&c.g===null&&!c.n))continue;
    rows.push([s.site,s.date,s.obs,i,Math.floor((i-1)/10)+1,(i-1)%10+1,c.s??'',c.g??'',c.n]);
  }
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
$('#btnExport').onclick=async()=>{
  const s=S(),name=`grid_${(s.site||'site').replace(/\W+/g,'_')}_${s.date}.csv`;
  const file=new File([csv(s)],name,{type:'text/csv'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();
};

if(!db.cur||!db.sessions[db.cur])newSession();
renderHeader();renderGrid();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script>
</body>
</html>
